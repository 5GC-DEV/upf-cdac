name: IOSMCN Release Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-push-images:
    if: github.repository_owner == 'ios-mcn-core'
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      DOCKER_REGISTRY: ghcr.io/
      DOCKER_REPOSITORY: ios-mcn-core/
      GITHUB_USERNAME: ${{ secrets.GHCRUSER }}
      GITHUB_TOKEN: ${{ secrets.GHCRPASS }}
      RELEASE_VERSION: 0.0.3

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCRUSER }}
          password: ${{ secrets.GHCRPASS }}

      - name: Build and push release Docker image for Haswell CPU
        env:
          DOCKER_TAG: release-haswell-${{ env.RELEASE_VERSION }}
          CPU: haswell
        run: |
          CPU=$CPU make docker-build -f Makefile_IOSMCN
          make docker-push -f Makefile_IOSMCN

      - name: Build and push release Docker image for Ivybridge CPU
        env:
          DOCKER_TAG: release-ivybridge-${{ env.RELEASE_VERSION }}
          CPU: ivybridge
        run: |
          CPU=$CPU make docker-build -f Makefile_IOSMCN
          make docker-push -f Makefile_IOSMCN
