name: IOSMCN Master workflow

on:
  pull_request:
    branches:
      - iosmcnmaster
  push:
    branches:
      - iosmcnmaster

jobs:
  #build:
    #if: github.event_name == 'pull_request'
    #runs-on: ubuntu-latest
    #steps:
      #- uses: actions/checkout@v4

      #- uses: actions/setup-go@v5
       # with:
         # go-version-file: 'go.mod'

     # - name: Generate protobuf
       # run: make pb

     # - name: Build the BESS-UPF Docker image
     #   run: DOCKER_TARGETS=bess make docker-build

     #- name: Build the PFCP Agent Docker image
      #  run: DOCKER_TARGETS=pfcpiface make docker-build

  build-ptf:
    if: github.event_name == 'pull_request' && github.repository_owner == 'ios-mcn-core'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ptf
    steps:
      - uses: actions/checkout@v4

      - name: Build PTF image
        run: make build -f Makefile_IOSMCN

  lint:
    name: lint
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.0.1
        with:
          version: latest
          args: --out-format=colored-line-number -v --config ./.golangci.yml --timeout=10m

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile linter
        uses: hadolint/hadolint-action@v3.1.0
        # For now, ignoring:
        # DL3007 warning: Pin the version explicitily to a release tag (no latest);
        # DL3008 warning: Pin versions in apt get install (e.g., apt-get install <package>=<version>); and
        # DL3018 warning: Pin versions in apk add (e.g., apk add <package>=<version>)
        with:
          dockerfile: Dockerfile
          ignore: DL3007,DL3008,DL3018

  check-spelling:
    name: Markdown spellcheck
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
      - uses: actions/checkout@v4

      - name: Check Spelling
        uses: rojopolis/spellcheck-github-actions@0.37.0
        with:
          config_path: .spellcheck.yml
          task_name: Markdown

  route-control-tests:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create virtual environment
      run: python -m venv venv

    - name: Install dependencies
      run: |
        source ./venv/bin/activate
        pip install -r requirements.txt

    - name: Run tests
      run: |
        source ./venv/bin/activate
        python -m unittest ./conf/test_route_control.py

    - name: Clean up virtual environment
      run: rm -rf venv

  unit-tests-pfcp:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run unit tests for PFCP Agent
        run: make test

  integration-tests-up4:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run integration tests for PFCP Agent & UP4
        run: make test-up4-integration-docker || (docker logs pfcpiface; exit 1)

  integration-tests-bess:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run integration tests for PFCP Agent & UP4
        run: make test-bess-integration-native

  license-check:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
      - uses: actions/checkout@v4

      - name: reuse lint
        uses: fsfe/reuse-action@v3

  fossa-check:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    steps:
      - uses: actions/checkout@v4

      - name: FOSSA scan
        uses: fossa-contrib/fossa-action@v3
        with:
          fossa-api-key: 0c3bbcdf20e157bbd487dae173751b28
          
  docker-build-push-images:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ios-mcn-core'
    needs: [route-control-tests, unit-tests-pfcp, integration-tests-up4, integration-tests-bess]
    
    env:
      REGISTRY: ghcr.io
      DOCKER_REGISTRY: ghcr.io/
      DOCKER_REPOSITORY: ios-mcn-core/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - run: echo GIT_SHA_SHORT=$(git rev-parse --short HEAD) >> $GITHUB_ENV

      - uses: docker/login-action@v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCRUSER }}
          password: ${{ secrets.GHCRPASS }}

      - name: Build and push release Docker image
        env:
          DOCKER_TAG: master-haswell-${{ env.GIT_SHA_SHORT }}
          CPU: haswell
        run: |
          CPU=$CPU make docker-build -f Makefile_IOSMCN
          make docker-push -f Makefile_IOSMCN

      - name: Build and push release Docker image for Ivybridge CPU
        env:
          DOCKER_TAG: master-ivybridge-${{ env.GIT_SHA_SHORT }}
          CPU: ivybridge
        run: |
          CPU=$CPU make docker-build -f Makefile_IOSMCN
          make docker-push -f Makefile_IOSMCN