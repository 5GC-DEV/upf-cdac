name: CDAC Master workflow

on:
  pull_request:
    branches:
      - cdacmaster
  push:
    branches:
      - cdacmaster
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/docker-build.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}
      run_pre_build: true
      docker_targets: "bess pfcp"

  build-ptf:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/docker-build.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}
      build_directory: "./ptf"
      build_command: "make build"

  static-analysis:
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/static-analysis.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}

  lint:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/lint.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      golangci_lint_version: 'v2.13.2'
      branch_name: ${{ github.ref }}

  hadolint:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/hadolint.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}

  check-spelling:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/check-spelling.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}

  route-control-tests:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/upf-route-control-tests.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}

  unit-tests-pfcp:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/unit-test.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}
      test_flags: "-race -failfast -v"
      test_directory: "./pfcpiface ./cmd/..."

  integration-tests-bess:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/unit-test.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}
      test_flags: "-race -failfast -v -count=1"
      test_directory: "./test/integration/..."
      env_vars: "MODE=native DATAPATH=bess"

  license-check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/license-check.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}

  fossa-scan:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/fossa-scan.yml@d57b6360a2cc92237c201f2bb9ad58b924ef7082 # v0.0.32
    with:
      branch_name: ${{ github.ref }}

  docker-build-push-images:
    if: github.event_name != 'pull_request' && github.repository_owner == '5GC-DEV'
    needs: [build, build-ptf, static-analysis, lint, hadolint, check-spelling, route-control-tests, unit-tests-pfcp, integration-tests-bess, license-check, fossa-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [haswell, ivybridge]
    env:
      DOCKER_REGISTRY: docker.io/
      DOCKER_REPOSITORY: cdac5gc/
      CPU: ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DCKRUSER }}
          password: ${{ secrets.DCKRPASS }}
      - name: Set image tag
        run: echo "DOCKER_TAG=master-${CPU}-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build images
        run: make -f Makefile_CDAC docker-build
      - name: Push images
        run: make -f Makefile_CDAC docker-push
