
name: CDAC Master

on:
  pull_request:
    branches:
      - cdacmaster
  push:
    branches:
      - cdacmaster
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKER_REGISTRY: docker.io/
  DOCKER_REPOSITORY: cdac5gc/

jobs:
  build-ptf:
    name: Build PTF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DCKRUSER }}
          password: ${{ secrets.DCKRPASS }}

      - name: Build PTF
        run: make ptf -f Makefile_CDAC

  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: Dockerfile_CDAC

  check-spelling:
    name: Check Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check spelling
        uses: codespell-project/actions-codespell@v2

  route-control-tests:
    name: Route Control Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run route control tests
        run: |
          go test ./routectl/...

  unit-tests-pfcp:
    name: PFCP Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PFCP unit tests
        run: |
          go test ./pfcpiface/...

  integration-tests-up4:
    name: UP4 Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run UP4 integration tests
        run: |
          make test-up4-integration-docker -f Makefile_CDAC

  integration-tests-bess:
    name: BESS Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run BESS integration tests
        run: |
          make test-bess-integration-native -f Makefile_CDAC

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run license check
        uses: fsfe/reuse-action@v5

  fossa-check:
    name: FOSSA Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run FOSSA analysis
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

  docker-build-push-images:
    name: Build and Push UPF Images
    runs-on: ubuntu-latest
    if: github.repository_owner == '5GC-DEV'
    strategy:
      fail-fast: false
      matrix:
        cpu:
          - haswell
          - ivybridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DCKRUSER }}
          password: ${{ secrets.DCKRPASS }}

      - name: Set short Git SHA
        id: vars
        run: echo "GIT_SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build and push BESS and PFCP images
        env:
          CPU: ${{ matrix.cpu }}
          DOCKER_TAG: master-${{ matrix.cpu }}-${{ github.sha }}
          DOCKER_REGISTRY: docker.io/
          DOCKER_REPOSITORY: cdac5gc/
        run: |
          make docker-build -f Makefile_CDAC
          make docker-push -f Makefile_CDAC
