name: CDAC Release Workflow

on:
  workflow_dispatch:

jobs:
  docker-build-push-images:
    runs-on: ubuntu-latest

    env:
      REGISTRY: docker.io
      DOCKER_REGISTRY: docker.io/
      DOCKER_REPOSITORY: cdac5gc/
      RELEASE_VERSION: 0.0.3
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - run: echo GIT_SHA_SHORT=$(git rev-parse --short HEAD) >> $GITHUB_ENV

      - uses: docker/login-action@v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DCKRUSER }}
          password: ${{ secrets.DCKRPASS }}
      
      - name: Clean Checksum
        run: go mod tidy

      - name: Build and push release Docker image for Haswell CPU
        env:
          DOCKER_TAG: release-haswell-${{ env.RELEASE_VERSION }}
          CPU: haswell
        run: |
          CPU=$CPU make docker-build -f Makefile_CDAC
          make docker-push -f Makefile_CDAC

      - name: Build and push release Docker image for Ivybridge CPU
        env:
          DOCKER_TAG: release-ivybridge-${{ env.RELEASE_VERSION }}
          CPU: ivybridge
        run: |
          CPU=$CPU make docker-build -f Makefile_CDAC
          make docker-push -f Makefile_CDAC